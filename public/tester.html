<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime GPT-4o Tester</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: 'Inter', system-ui, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        min-height: 100vh;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      main {
        display: grid;
        gap: 1.5rem;
      }

      section {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.4);
        border-radius: 16px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.3);
      }

      h1 {
        font-weight: 700;
        margin: 0;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        font-size: 0.95rem;
      }

      input,
      textarea,
      button {
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.6);
        padding: 0.75rem 1rem;
        font: inherit;
        background: rgba(15, 23, 42, 0.9);
        color: inherit;
      }

      button {
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 30px rgba(56, 189, 248, 0.3);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .status {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .status-line {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .pill {
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        background: rgba(94, 234, 212, 0.1);
        border: 1px solid rgba(94, 234, 212, 0.5);
        font-size: 0.9rem;
      }

      .log {
        min-height: 160px;
        max-height: 280px;
        overflow-y: auto;
        border-radius: 12px;
        padding: 1rem;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.3);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }

      .emotion {
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      .emotion span {
        font-size: 1.1rem;
        font-weight: 600;
      }

      .intensity {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.3);
        overflow: hidden;
      }

      .intensity > div {
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #a855f7);
        transition: width 200ms ease;
      }

      @media (max-width: 720px) {
        body {
          padding: 1rem;
        }

        section {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GPT-4o Realtime Tester</h1>
      <p>
        Connects to <code>server/server.js</code> via WebSocket to stream audio and
        text in realtime. Toggle the microphone, send chat messages, and inspect
        emotion analysis.
      </p>
    </header>

    <main>
      <section>
        <h2>Connection</h2>
        <div class="controls">
          <button id="connect">Connect</button>
          <button id="disconnect">Disconnect</button>
          <button id="mic">Mic: Off</button>
          <button id="flush">Flush Output</button>
        </div>
        <div class="status">
          <div class="status-line">Status: <span id="status">idle</span></div>
          <div class="status-line">Mic: <span id="mic-status">disabled</span></div>
        </div>
      </section>

      <section>
        <h2>Persona</h2>
        <div class="controls">
          <label>
            Persona Instructions
            <textarea id="persona" rows="4">You are an adaptive AI guide named Aurora. You can explain the environment, guide the user, and keep a friendly tone.</textarea>
          </label>
          <label>
            First Line (Intro)
            <input id="intro" value="Hello! I'm Aurora. I'm here to guide you." />
          </label>
          <label>
            Voice ID
            <input id="voice" value="verse" />
          </label>
          <button id="apply">Apply</button>
        </div>
      </section>

      <section>
        <h2>Chat</h2>
        <div class="controls">
          <input id="message" placeholder="Type a message" />
          <button id="send">Send</button>
        </div>
        <div class="log" id="text-log"></div>
      </section>

      <section>
        <h2>Emotion</h2>
        <div class="emotion">
          <span id="emotion-label">emotion: neutral</span>
          <span id="intensity-label">intensity: 0</span>
        </div>
        <div class="intensity"><div id="intensity-bar" style="width: 0%"></div></div>
      </section>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const micStatusEl = document.getElementById('mic-status');
      const logEl = document.getElementById('text-log');
      const emotionLabelEl = document.getElementById('emotion-label');
      const intensityLabelEl = document.getElementById('intensity-label');
      const intensityBarEl = document.getElementById('intensity-bar');

      const connectBtn = document.getElementById('connect');
      const disconnectBtn = document.getElementById('disconnect');
      const micBtn = document.getElementById('mic');
      const flushBtn = document.getElementById('flush');
      const sendBtn = document.getElementById('send');
      const applyBtn = document.getElementById('apply');

      const personaInput = document.getElementById('persona');
      const introInput = document.getElementById('intro');
      const voiceInput = document.getElementById('voice');
      const messageInput = document.getElementById('message');

      let socket = null;
      let audioContext;
      let processor;
      let microphone;
      let mediaStream;
      let silentGainNode;
      let micEnabled = false;
      let closing = false;
      let playbackQueue = [];
      let currentSource = null;
      let playing = false;

      const flushPlayback = () => {
        playbackQueue = [];
        if (currentSource) {
          try {
            currentSource.stop();
          } catch (error) {
            console.warn('Failed to stop source', error);
          }
        }
        currentSource = null;
        playing = false;
      };

      function appendLog(content) {
        const line = document.createElement('div');
        line.textContent = content;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function ensureAudioContext() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: 48000,
            latencyHint: 'interactive',
          });
        }
        return audioContext;
      }

      function floatTo16BitPCM(float32Array) {
        const buffer = new ArrayBuffer(float32Array.length * 2);
        const view = new DataView(buffer);
        let offset = 0;
        for (let i = 0; i < float32Array.length; i += 1, offset += 2) {
          let s = Math.max(-1, Math.min(1, float32Array[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        }
        return buffer;
      }

      function downsampleBuffer(buffer, sampleRate, outSampleRate) {
        if (outSampleRate === sampleRate) {
          return buffer;
        }
        const sampleRateRatio = sampleRate / outSampleRate;
        const newLength = Math.round(buffer.length / sampleRateRatio);
        const result = new Float32Array(newLength);
        let offsetResult = 0;
        let offsetBuffer = 0;
        while (offsetResult < result.length) {
          const nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
          let accumulator = 0;
          let count = 0;
          for (
            let i = offsetBuffer;
            i < Math.min(nextOffsetBuffer, buffer.length);
            i += 1
          ) {
            accumulator += buffer[i];
            count += 1;
          }
          result[offsetResult] = count > 0 ? accumulator / count : 0;
          offsetResult += 1;
          offsetBuffer = nextOffsetBuffer;
        }
        return result;
      }

      function encodeBase64(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i += 1) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      async function handleAudioChunk(base64) {
        const ctx = ensureAudioContext();
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        const pcm = new Int16Array(bytes.buffer);
        const audioBuffer = ctx.createBuffer(1, pcm.length, 48000);
        const channel = audioBuffer.getChannelData(0);
        for (let i = 0; i < pcm.length; i += 1) {
          channel[i] = pcm[i] / 32768;
        }
        playbackQueue.push(audioBuffer);
        if (!playing) {
          playNext();
        }
      }

      function playNext() {
        if (playing) return;
        const ctx = ensureAudioContext();
        const next = playbackQueue.shift();
        if (!next) {
          playing = false;
          currentSource = null;
          return;
        }
        playing = true;
        const source = ctx.createBufferSource();
        source.buffer = next;
        source.connect(ctx.destination);
        source.onended = () => {
          playing = false;
          currentSource = null;
          playNext();
        };
        currentSource = source;
        source.start();
      }

      function startMicrophone() {
        if (micEnabled) return;
        const ctx = ensureAudioContext();
        navigator.mediaDevices
          .getUserMedia({ audio: true })
          .then((stream) => {
            mediaStream = stream;
            microphone = ctx.createMediaStreamSource(stream);
            processor = ctx.createScriptProcessor(4096, 1, 1);
            silentGainNode = ctx.createGain();
            silentGainNode.gain.value = 0;
            processor.onaudioprocess = (event) => {
              if (!micEnabled) {
                return;
              }
              const input = event.inputBuffer.getChannelData(0);
              const downsampled = downsampleBuffer(input, ctx.sampleRate, 24000);
              const pcm = floatTo16BitPCM(downsampled);
              const base64 = encodeBase64(pcm);
              if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(
                  JSON.stringify({ type: 'audio-chunk', audio: base64 })
                );
              }
            };
            microphone.connect(processor);
            processor.connect(silentGainNode);
            silentGainNode.connect(ctx.destination);
            micEnabled = true;
            micBtn.textContent = 'Mic: On';
            micStatusEl.textContent = 'enabled';
            if (socket && socket.readyState === WebSocket.OPEN) {
              socket.send(JSON.stringify({ type: 'toggle-mic', enabled: true }));
            }
          })
          .catch((error) => {
            console.error('Microphone error', error);
            appendLog('Microphone error: ' + error.message);
          });
      }

      function stopMicrophone() {
        if (!micEnabled) return;
        if (processor) {
          processor.disconnect();
          processor.onaudioprocess = null;
        }
        if (microphone) {
          microphone.disconnect();
        }
        if (silentGainNode) {
          silentGainNode.disconnect();
          silentGainNode = null;
        }
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
        }
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'audio-stop' }));
          socket.send(JSON.stringify({ type: 'toggle-mic', enabled: false }));
        }
        micEnabled = false;
        micBtn.textContent = 'Mic: Off';
        micStatusEl.textContent = 'disabled';
      }

      function connect() {
        if (socket && socket.readyState === WebSocket.OPEN) {
          return;
        }
        closing = false;
        socket = new WebSocket(`ws://${location.host}`);
        socket.binaryType = 'arraybuffer';

        socket.addEventListener('open', () => {
          statusEl.textContent = 'connected';
          appendLog('[connected]');
          applyPersona();
        });

        socket.addEventListener('close', () => {
          statusEl.textContent = 'closed';
          appendLog('[disconnected]');
          if (!closing) {
            setTimeout(connect, 1500);
          }
        });

        socket.addEventListener('error', (event) => {
          console.error('Socket error', event);
          appendLog('[socket error]');
        });

        socket.addEventListener('message', async (event) => {
          const data = JSON.parse(event.data);
          switch (data.type) {
            case 'session':
              appendLog('[session updated]');
              break;
            case 'status':
              statusEl.textContent = data.status;
              break;
            case 'mic':
              micStatusEl.textContent = data.enabled ? 'enabled' : 'disabled';
              micBtn.textContent = data.enabled ? 'Mic: On' : 'Mic: Off';
              micEnabled = data.enabled;
              break;
            case 'flush':
              appendLog(`[flush:${data.reason}]`);
              flushPlayback();
              break;
            case 'text-delta':
              appendLog(data.full);
              break;
            case 'audio-delta':
              await handleAudioChunk(data.audio);
              break;
            case 'response-complete':
              appendLog('[assistant] ' + data.text);
              emotionLabelEl.textContent = `emotion: ${data.emotion ?? 'neutral'}`;
              intensityLabelEl.textContent = `intensity: ${data.intensity ?? 0}`;
              const percent = Math.min(100, ((data.intensity ?? 0) / 5) * 100);
              intensityBarEl.style.width = `${percent}%`;
              break;
            case 'error':
              appendLog('[error] ' + data.message);
              break;
            default:
              break;
          }
        });
      }

      function disconnect() {
        if (!socket) return;
        closing = true;
        socket.close();
        socket = null;
        statusEl.textContent = 'idle';
        stopMicrophone();
      }

      function sendMessage() {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        const text = messageInput.value.trim();
        if (!text) return;
        socket.send(JSON.stringify({ type: 'text', text }));
        messageInput.value = '';
      }

      function applyPersona() {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(
          JSON.stringify({
            type: 'set-persona',
            persona: personaInput.value,
            voice: voiceInput.value,
          })
        );
        socket.send(
          JSON.stringify({
            type: 'set-intro',
            intro: introInput.value,
          })
        );
      }

      connectBtn.addEventListener('click', connect);
      disconnectBtn.addEventListener('click', disconnect);
      micBtn.addEventListener('click', () => {
        if (micEnabled) {
          stopMicrophone();
        } else {
          startMicrophone();
        }
      });
      flushBtn.addEventListener('click', () => {
        flushPlayback();
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'flush' }));
        }
      });
      sendBtn.addEventListener('click', sendMessage);
      applyBtn.addEventListener('click', applyPersona);
      messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          sendMessage();
        }
      });

      window.addEventListener('beforeunload', () => {
        disconnect();
      });

      connect();
    </script>
  </body>
</html>
